    <h1 style="color: goldenrod;">Tour Booking Form</h1>
    <br>
    <br>
    <br>
    
    <form>
        
       <label for="name" style="color: black;" required>Name:*</label>
       <input type="text" id="name" style="border-color: goldenrod;">
        <br>
       <br>
       <label for="Address" style="color: black;" >Address:</label>
       <input type="text" id="Address" style="border-color: goldenrod;">
       <br>
       <br>
       <label for="contact" style="color: black;" required>Contact:*</label>
       <input type="tel" id="contact" style="border-color: goldenrod;">
        <br>
       <br>
       <label for="alter-contact" style="color: black;" required>Alternative contact:</label>
       <input type="text" id="alter-contact" style="border-color: goldenrod;">
       <br>
       <br>
       <label for="email" style="color: black;" required>Email Address:*</label>
       <input type="email" id="email" style="border-color: goldenrod;">
        <br>
       <br>
       <label for="date" style="color: black;" required>When to go:*</label>
       <input type="date" id="date" style="border-color: goldenrod;">
       <br>
       <br>
        <label for="destination" style="color: black;" required>Destination name:*</label>
       <input type="text" id="destination" style="border-color: goldenrod;">


       <br>
       <br>
       <br>
       <br>
       <br>
       <br>
       
          <button type="submit" style="color: white;display: flex;align-items: center;width: 90px;justify-content: center;margin-left: 20%;">Submit form</button>
       
    </form>
